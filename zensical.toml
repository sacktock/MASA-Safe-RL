[project]
site_name = "MASA-Safe-RL"
site_description = "Safe learning across agents, constraints and worlds."
site_author = "Alexander Goodall, Omar Adalat, Edwin Hamel De Le Court, Francesco Belardinelli"
site_url = "https://nightly.github.io/MASA-Safe-RL/"
repo_url = "https://github.com/nightly/MASA-Safe-RL"
repo_name = "nightly/MASA-Safe-RL"
edit_uri = "edit/main/docs/"
copyright = "Copyright &copy; 2025, Alexander Goodall, Omar Adalat, Edwin Hamel De Le Court, Francesco Belardinelli"
docs_dir = "docs"
site_dir = "site"
# Retain Sphinx-era page URLs. Generated member anchors may differ.
use_directory_urls = false
exclude_docs = """
README.md
Makefile
make.bat
_build/
"""
extra_css = ["_static/custom.css"]
extra_javascript = [
  "_static/mathjax.js",
  "https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js",
]
watch = ["masa"]
# MIGRATION_NAV

[project.theme]
variant = "modern"
language = "en"
logo = "assets/images/logo.svg"
favicon = "assets/images/logo.png"
# Local system fonts avoid an additional font CDN dependency.
font = false
features = [
  "navigation.instant",
  "navigation.instant.progress",
  "navigation.tabs",
  "navigation.sections",
  "navigation.indexes",
  "navigation.top",
  "navigation.footer",
  "content.code.copy",
  "content.code.annotate",
  "content.action.edit",
  "content.action.view",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "material/theme-light-dark"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "material/weather-sunny"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "material/weather-night"
toggle.name = "Switch to system preference"

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.tables]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.arithmatex]
generic = true
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true

[project.plugins.search]
[project.plugins.mkdocstrings.handlers.python]
paths = ["."]

[project.plugins.mkdocstrings.handlers.python.options]
# Static source analysis does not require TensorFlow, JAX, or a GPU runtime.
allow_inspection = false
extensions = ["scripts/docs_docstrings.py:MarkdownDocstrings"]
docstring_style = "google"
docstring_section_style = "table"
members_order = "source"
show_root_heading = true
show_root_full_path = true
show_bases = true
show_source = true
show_signature_annotations = true
separate_signature = true
merge_init_into_class = true
heading_level = 2
filters = ["!^_"]

[project.validation]
invalid_links = true
invalid_link_anchors = true
