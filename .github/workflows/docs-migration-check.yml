name: Docs migration workspace

on:
  push:
    branches: [docs/migrate-to-zensical]
    paths: [.github/workflows/docs-migration-check.yml]

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Export tracked sources for migration validation
        run: git archive HEAD -o source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: docs-migration-source
          path: source.zip
          retention-days: 1
