defaults:
  env:
    id: ColourBombGridWorldV2
    max_episode_steps: 250
    label_fn: masa.envs.tabular.colour_bomb_grid_world_v2:label_fn
    cost_fn: masa.envs.tabular.colour_bomb_grid_world_v2:cost_fn
  constraint:
    type: PCTL
    alpha: 0.025
  run:
    total_timesteps: 500000
    eval_every: 10000
    eval_episodes: 10
    log_every: 10000
    stats_window_size: 100
Property2:
  constraint:
    type: LTL_SAFETY
    dfa: masa.examples.colour_bomb_grid_world.property_2:make_dfa
Property3:
  constraint:
    type: LTL_SAFETY
    dfa: masa.examples.colour_bomb_grid_world.property_3:make_dfa
Property3Cycle:
  constraint:
    type: LTL_SAFETY
    dfa: masa.examples.colour_bomb_grid_world.property_3:make_dfa
  reward_shaping:
    impl: cycle
    gamma: 0.95
Property3Potential:
  constraint:
    type: LTL_SAFETY
    dfa: masa.examples.colour_bomb_grid_world.property_3:make_dfa
  reward_shaping:
    impl: vi
    gamma: 0.95
Property3NoCfe:
  constraint:
    type: LTL_SAFETY
    dfa: masa.examples.colour_bomb_grid_world.property_3:make_dfa
